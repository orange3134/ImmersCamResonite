# This file is used by the Thunderstore CLI to build and publish your mod to Thunderstore. https://github.com/thunderstore-io/thunderstore-cli

[config]
schemaVersion = "0.0.1"

[package]
namespace = "orange3134" # TODO: Change this to the team you're uploading the mod to on Thunderstore
name = "ResoniteImmersCam" # Change this to your mod's name, no spaces or special characters, max 128 characters
# `dotnet build -c Release -t:PackTS` の場合は Directory.Build.props の $(Version) が優先される。
# 素の `dotnet tcli build` ではこの値が使われるので、両者を必ず揃えること。
versionNumber = "1.0.1" # Uncomment this if publishing via manual tcli! Change this to your mod's version, must be in semantic versioning format (e.g. 1.0.0, 2.1.3, 0.1.0-alpha.1)
description = "A MOD for recording VR180 video in Resonite." # TODO: Change this to your mod's description, max 250 characters
websiteUrl = "https://github.com/orange3134/ImmersCamResonite" # TODO: Change this to your mod's website/repository, or leave blank
containsNsfwContent = false

# List any dependencies your mod has here, in the format "namespace-modname" = "version-constraint"
[package.dependencies] 
ResoniteModding-BepisLoader = "1.7.0"
ResoniteModding-BepInExResoniteShim = "0.9.3"
ResoniteModding-BepisResoniteWrapper = "1.0.2"
# Renderer プロセス側: RenderiteHook が Doorstop を仕込み、BepInExRenderer が BepInEx 5 本体を提供する。
# どちらも欠けると Renderer プラグイン / パッチャーが一切読み込まれない。
ResoniteModding-RenderiteHook = "1.1.1"
ResoniteModding-BepInExRenderer = "5.4.233001"
# ゲーム内設定 UI (ダッシュメニュー)。1.6.x から BepisLocaleLoader が必須になった。
ResoniteModding-BepisModSettings = "1.6.6"
ResoniteModding-BepisLocaleLoader = "1.2.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

# Copy the compiled DLL to the plugins folder in the mod package
[[build.copy]]
source = "./Reso360Spout2/bin/Release/Reso360Spout2.dll"
target = "plugins/Reso360Spout2/"

# Include the PDB file for better debugging support
[[build.copy]]
source = "./Reso360Spout2/bin/Release/Reso360Spout2.pdb"
target = "plugins/Reso360Spout2/"

# シェーダーアセットバンドル
[[build.copy]]
source = "./Reso360Spout2/cubeto360"
target = "plugins/Reso360Spout2/"

# ---- Renderer プロセス用 ----

# Renderer メインプラグイン
[[build.copy]]
source = "./Reso360Spout2.Renderer/bin/Release/net472/Reso360Spout2.Renderer.dll"
target = "Renderer/BepInEx/plugins/Reso360Spout2.Renderer/"

[[build.copy]]
source = "./Reso360Spout2/cubeto360"
target = "Renderer/BepInEx/plugins/Reso360Spout2.Renderer/"

# KlakSpout.dll (Renderer プラグインが参照)
[[build.copy]]
source = "./Reso360Spout2/KlakSpout.dll"
target = "Renderer/BepInEx/plugins/Reso360Spout2.Renderer/"

# KlakSpout_send.dll (Renderer プラグインが参照)
[[build.copy]]
source = "./Reso360Spout2/KlakSpout_send.dll"
target = "Renderer/BepInEx/plugins/Reso360Spout2.Renderer/"

# BepInEx Patcher: Unity 起動前に KlakSpout_send.dll を Plugins/x86_64/ にコピー
[[build.copy]]
source = "./Reso360Spout2.Patcher/bin/Release/net472/Reso360Spout2.Patcher.dll"
target = "Renderer/BepInEx/patchers/Reso360Spout2.Patcher/"

[[build.copy]]
source = "./Reso360Spout2/KlakSpout_send.dll"
target = "Renderer/BepInEx/patchers/Reso360Spout2.Patcher/"

# Uncomment the following lines to include CHANGELOG file in your mod package. https://wiki.thunderstore.io/mods/updating-a-package#changelog
[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

# Uncomment the following line to include LICENSE file in your mod package, if you have one.
[[build.copy]]
source = "./LICENSE"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = ["tools"] # TODO: Change this to your mod's categories, see https://thunderstore.io/api/experimental/community/resonite/category/ for a list of available categories
